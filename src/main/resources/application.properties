spring.application.name=backend
server.port=8081

# MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/jwtauthdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
